[build-system]
requires = ["setuptools>=63.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mistake-lang"
version = "0.2.1"
description = "A Mistake"
readme = "README.md"
authors = [
    {name = "Elliot", email = "captainexpo@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.14"

dependencies = [
    "gevent>=25.4",
    "pyairtable>=3.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
vulkan = [
    "kp==0.9.0",
    "vulkan",
    "numpy==1.26.4"
]

[project.urls]
"Homepage" = "https://github.com/captainexpo/Mistake-Lang"
"Source" = "https://github.com/captainexpo/Mistake-Lang"
"Tracker" = "https://github.com/captainexpo/Mistake-Lang/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mistake-lang = "mistake.main:main"
